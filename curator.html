<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator Dashboard | EcoQuest</title>
    <link rel="stylesheet" href="./styles/curator/dashboard.css">
    <link rel="stylesheet" href="./styles/curator/sidebar.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <div id="page">
        <div id="sidebar">
            <div id="top">
                <h3>CURATOR DASHBOARD</h3>
            </div>
            <div id="tabs">
                <h5 class="border" data-selected>SUBMISSIONS</h5>
                <h5 class="border">TASKS</h5>
                <h5 class="border">SCHEDULE</h5>
            </div>
            <!-- <input> -->
            <hr>
            <div id="query">
                <div id="search">
                    <input class="border" placeholder="🔍 search submissions">
                </div>
                <h6 id="filter-subtitle">SHOW ONLY:</h6>
                <div id="filter">
                    <h6 class="border" data-selected>PENDING</h6>
                    <h6 class="border">APPROVED</h6>
                    <h6 class="border">REJECTED</h6>
                </div>
            </div>
            <hr>
            <div id="overview">
                <h5>OVERVIEW</h5>
                <div id="submissions">
                    <!-- total, approved, rejected, pending -->
                    <div id="pie">
                        <div id="pending"></div>
                        <div id="approved"></div>
                        <div id="rejected"></div>
                    </div>
                    <div id="statistics">
                        <span id="pending">
                            <h5>14 PENDING</h5>
                            <h5>15%</h5>
                        </span>
                        <span id="approved">
                            <h5>6 APPROVED</h5>
                            <h5>15%</h5>
                        </span>
                        <span id="rejected">
                            <h5>7 REJECTED</h5>
                            <h5>15%</h5>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./scripts/script.js"></script>
</body>

</html>
