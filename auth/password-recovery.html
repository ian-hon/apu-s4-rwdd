<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | EcoQuest</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/auth/login.css">
    <link rel="stylesheet" href="../styles/auth/password-recovery.css">
</head>

<body>
    <div id="parent">
        <div id="logo">
            <h1>EcoQuest</h1>
        </div>

        <div id="login-page-box">
            <div id="greeting">
                <h3>Forgot Password?</h3>
                <h4 id="subtitle">No worries, we're here to help</h4>
            </div>

            <form action="" method="post" name="login">
                <div id="input-section">    
                    <h4>Email</h4>
                    <div id="input-form">
                        <div id="input-icon">
                            <img id="email-icon" src="/assets/email.svg" alt="email-icon">
                        </div>
                        <input type="email" placeholder="your@email.com"> 
                    </div>
                </div>
            </form>

            <div>
                <button class="button" id="login-button"><a href="/auth/password-recovery-confirmation.html">Reset Password</a></button>
            </div>

            <div id="no-account">
                <h3><a href="/auth/login.html">&larr; Back to sign in</a></h3>
            </div>
        </div>
    </div>

    <script src="../scripts/script.js"></script>
</body>

</html>
