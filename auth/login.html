<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoQuest</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/auth/login.css">
</head>

<body>
    <div id="parent">
        <div id="logo">
            <h1>EcoQuest</h1>
        </div>

        <div id="login-page-box">
            <div id="greeting">
                <h3>Welcome Back</h3>
                <h4 id="subtitle">Sign in to continue your journey</h4>
            </div>

            <form action="" method="post" name="login">
                <div id="input-section">    
                    <h4>Email</h4>
                    <div id="input-form">
                        <div id="input-icon">
                            <img id="email-icon" src="/assets/email.svg" alt="email-icon">
                        </div>
                        <input type="email" placeholder="your@email.com"> 
                    </div>
                    <h4>Password</h4>
                    <div id="input-form">
                        <div id="input-icon">
                            <img id="password-icon" src="/assets/password.svg" alt="password-icon">
                        </div>
                        <input type="password" placeholder="Enter your password">
                    </div>
                </div>
            </form>


            <div id="remember-me-forgot-password">
                <div id="remember-me">
                    <div>
                        <input type="checkbox">
                    </div>                  
                    <div>
                        <p id="remember-me-text">Remember me</p>
                    </div>  
                </div>
                <div id="forgot-password">
                    <a href="/auth/password-recovery.html" target="_blank">Forgot Password?</a>
                </div>
            </div>
            
            
            <div>
                <h5 id="or-continue-with">or</h5>
            </div>

            <div id="continue-with">
                <button class="button">Continue with Google</button>
                <button class="button">Continue with Apple</button>
            </div>

            <div>
                <button class="button" id="login-button">Login</button>
            </div>
            <div id="no-account">
                <h3>Don't have an account?<a href="/auth/register.html">Sign Up</a></h3>
            </div>
        </div>
    </div>

    <script src="../scripts/script.js"></script>
</body>

</html>
