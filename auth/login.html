<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | EcoQuest</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/auth/login.css">
</head>

<body>
    <div id="parent">
        <div id="logo">
            <h1>EcoQuest</h1>
        </div>

        <div id="login-page-box">
            <div id="welcome-back">
                <h3>Welcome Back</h3>
                <h4 class="subtitle">Sign in to continue your journey</h4>
            </div>
            <div>
                <h3 class="email-password">Email</h3>
                <input type="text" placeholder="your@email.com">
            </div>
            <div>
                <h3 class="email-password">Password</h3>
                <input type="text" placeholder="Enter your password">
            </div>
            <div id="forgot-password">
                <a href="https://www.wikipedia.com/" target="_blank">Forgot Password?</a>
            </div>
            <div>
                <p id="or-page-divider">or</p>
            </div>
            <div>
                <button class="continue-with-btn">Continue with Google</button>
                <button class="continue-with-btn">Continue with Apple</button>
            </div>
            <div>
                <button id="login-btn">Login</button>
            </div>
            <div>
                <h4 id="no-account">Don't have an account?<span id="sign-up">Sign Up</span></h4>
            </div>
        </div>
    </div>

    <script src="../scripts/script.js"></script>
</body>

</html>
